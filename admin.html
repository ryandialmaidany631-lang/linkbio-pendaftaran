<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Pendaftaran Sekolah</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="admin-container">
        <h2>Panel Admin Pendaftaran</h2>
        
        <form id="form-admin">
            <div class="form-group">
                <label for="input-judul">Judul Situs</label>
                <input type="text" id="input-judul" placeholder="Masukkan judul situs...">
            </div>

            <div class="form-group">
                <label for="input-tagline">Tagline / Deskripsi Singkat</label>
                <input type="text" id="input-tagline" placeholder="Masukkan tagline...">
            </div>

            <div class="form-group">
                <label for="input-pendaftaran">Link Pendaftaran Utama</label>
                <input type="url" id="input-pendaftaran" placeholder="https://...">
            </div>

            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">

            <h3>Upload Brosur per Tingkatan (PDF/Gambar)</h3>
            
            <div class="form-group">
                <label>Brosur TKQ</label>
                <input type="file" id="input-brosur-tkq" accept=".pdf,image/*">
            </div>

            <div class="form-group">
                <label>Brosur ULA (SD)</label>
                <input type="file" id="input-brosur-ula" accept=".pdf,image/*">
            </div>

            <div class="form-group">
                <label>Brosur WUSTHO (SMP)</label>
                <input type="file" id="input-brosur-wustho" accept=".pdf,image/*">
            </div>

            <div class="form-group">
                <label>Brosur ULYA (SMA)</label>
                <input type="file" id="input-brosur-ulya" accept=".pdf,image/*">
            </div>

            <button type="submit" class="btn-save">SIMPAN PERUBAHAN</button>
        </form>

        <div style="text-align: center; margin-top: 15px;">
            <a href="index.html" style="color: #666; text-decoration: none;">← Kembali ke halaman publik</a>
        </div>
    </div>

    <!-- POP-UP MODAL SUKSES -->
    <div id="success-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 9999;">
        <div style="background: white; padding: 30px; border-radius: 12px; text-align: center; max-width: 320px; width: 90%; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
            <h3 style="margin-bottom: 10px; color: #333;">Berhasil!</h3>
            <p style="color: #666; margin-bottom: 20px;">Brosur dan perubahan data berhasil disimpan.</p>
            <button id="modal-ok-btn" style="padding: 10px 25px; background: #111; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">OK</button>
        </div>
    </div>

    <!-- Memanggil script admin -->
    <script type="module" src="admin.js"></script>
</body>
</html>
