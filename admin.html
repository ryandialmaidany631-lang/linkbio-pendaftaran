<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Admin Link Bio</title>
    <link rel="stylesheet" href="style.css?v=301">
</head>
<body>
    <div class="admin-container">
        <h2>Admin Link Bio</h2>
        <p class="subtitle">Panel Pengaturan Online (Terhubung ke Firebase)</p>
        
        <form id="form-admin">
            <div class="form-group">
                <label>Nama sekolah</label>
                <input type="text" id="input-judul" placeholder="Masukkan nama sekolah">
            </div>

            <div class="form-group">
                <label>Tagline</label>
                <input type="text" id="input-tagline" placeholder="Masukkan tagline sekolah">
            </div>

            <div class="form-group">
                <label>Upload Logo Sekolah</label>
                <input type="file" id="input-logo" accept="image/*">
            </div>

            <div class="section-title">Link utama</div>
            
            <div class="form-group">
                <label>Website Pendaftaran</label>
                <input type="url" id="input-pendaftaran" placeholder="https://...">
            </div>

            <div class="form-group">
                <label>WhatsApp Admin 1 (Nama & Nomor)</label>
                <input type="text" id="wa-name-1" placeholder="Nama Admin 1 (Contoh: Ustadz Jimmy)" style="margin-bottom: 5px;">
                <input type="text" id="wa-number-1" placeholder="Nomor WA (Contoh: 628123456789)">
            </div>

            <div class="form-group">
                <label>WhatsApp Admin 2 (Nama & Nomor)</label>
                <input type="text" id="wa-name-2" placeholder="Nama Admin 2" style="margin-bottom: 5px;">
                <input type="text" id="wa-number-2" placeholder="Nomor WA">
            </div>

            <div class="form-group">
                <label>WhatsApp Admin 3 (Nama & Nomor)</label>
                <input type="text" id="wa-name-3" placeholder="Nama Admin 3" style="margin-bottom: 5px;">
                <input type="text" id="wa-number-3" placeholder="Nomor WA">
            </div>

            <div class="section-title">Upload Brosur per Tingkatan (PDF/Gambar)</div>
            <div class="form-group">
                <label>Brosur TKQ</label>
                <input type="file" id="input-brosur-tkq" accept=".pdf,image/*">
            </div>
            <div class="form-group">
                <label>Brosur ULA (SD)</label>
                <input type="file" id="input-brosur-ula" accept=".pdf,image/*">
            </div>
            <div class="form-group">
                <label>Brosur WUSTHO (SMP)</label>
                <input type="file" id="input-brosur-wustho" accept=".pdf,image/*">
            </div>
            <div class="form-group">
                <label>Brosur ULYA (SMA)</label>
                <input type="file" id="input-brosur-ulya" accept=".pdf,image/*">
            </div>

            <button type="submit" class="btn-save">SIMPAN PERUBAHAN</button>
        </form>

        <div class="back-link">
            <a href="index.html">← Kembali ke halaman publik</a>
        </div>
    </div>

    <!-- POP-UP MODAL SUKSES -->
    <div id="success-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-icon">✅</div>
            <h3>Berhasil Disimpan!</h3>
            <p>Data sekolah, link, dan brosur PDF berhasil di-upload ke Firebase.</p>
            <button id="modal-ok-btn" class="btn-modal-ok">OK / Lihat Perubahan</button>
        </div>
    </div>

    <script type="module" src="admin.js?v=301"></script>
</body>
</html>
