<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Link Bio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="admin-container">
        <h2>Panel Administrator</h2>
        
        <form id="form-admin">
            <div class="form-group">
                <label>Nama/Judul Sekolah:</label>
                <input type="text" id="input-judul" placeholder="Contoh: SMA Negeri 1 Medan">
            </div>

            <div class="form-group">
                <label>Upload Logo Sekolah:</label>
                <input type="file" id="input-logo" accept="image/*">
            </div>

            <div class="form-group">
                <label>Link Pendaftaran:</label>
                <input type="url" id="input-pendaftaran" placeholder="https://..." required>
            </div>

            <div class="form-group">
                <label>Upload File Brosur (PDF/Gambar):</label>
                <input type="file" id="input-brosur" accept=".pdf,image/*">
            </div>

            <hr style="margin: 20px 0;">
            <h3>Kontak Person WhatsApp (Maksimal 3 Nomor)</h3>
            
            <div class="form-group">
                <label>WhatsApp 1 (Nama & Nomor):</label>
                <input type="text" id="wa-name-1" placeholder="Contoh: Admin 1 (Pak Budi)">
                <input type="text" id="wa-number-1" placeholder="Contoh: 6281234567890">
            </div>

            <div class="form-group">
                <label>WhatsApp 2 (Nama & Nomor):</label>
                <input type="text" id="wa-name-2" placeholder="Contoh: Admin 2 (Bu Siti)">
                <input type="text" id="wa-number-2" placeholder="Contoh: 6289876543210">
            </div>

            <div class="form-group">
                <label>WhatsApp 3 (Nama & Nomor):</label>
                <input type="text" id="wa-name-3" placeholder="Contoh: Admin 3 (Panitia)">
                <input type="text" id="wa-number-3" placeholder="Contoh: 6281122334455">
            </div>

            <button type="submit" class="btn-save">Simpan Perubahan</button>
        </form>
    </div>

    <script src="admin.js"></script>
</body>
</html>
