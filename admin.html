<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Pengaturan Sekolah</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 20px;
            color: #334155;
        }
        .container {
            max-width: 600px;
            background: #ffffff;
            margin: 0 auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h2 {
            margin-top: 0;
            color: #1e293b;
            text-align: center;
            margin-bottom: 25px;
        }
        .mb-3 {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 14px;
        }
        input[type="text"], input[type="url"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        small {
            display: block;
            margin-top: 4px;
            color: #64748b;
            font-size: 12px;
        }
        .brochure-section {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            margin-top: 25px;
        }
        .brochure-section h3 {
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 15px;
            color: #1e293b;
        }
        .btn-save {
            background: #0f172a;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn-save:hover {
            background: #1e293b;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Dashboard Pengaturan Admin</h2>

    <form id="form-admin">
        
        <!-- URL Logo Sekolah -->
        <div class="mb-3" style="padding: 15px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0;">
            <label for="input-logo-url">Link URL Logo Sekolah</label>
            <input type="url" id="input-logo-url" placeholder="https://i.ibb.co/... atau link gambar publik">
            <small>Masukkan link gambar logo (bisa upload dulu ke Imgur, PostImage, atau Google Drive publik).</small>
        </div>

        <!-- Pengaturan Teks Utama -->
        <div class="mb-3">
            <label for="input-judul">Judul Utama / Nama Lembaga</label>
            <input type="text" id="input-judul" placeholder="Contoh: Yayasan Pendidikan Islam...">
        </div>

        <div class="mb-3">
            <label for="input-tagline">Tagline / Deskripsi Singkat</label>
            <input type="text" id="input-tagline" placeholder="Contoh: Unggul, Berkarakter, dan Islami">
        </div>

        <div class="mb-3">
            <label for="input-pendaftaran">Link Pendaftaran Online (URL)</label>
            <input type="url" id="input-pendaftaran" placeholder="https://forms.gle/...">
        </div>

        <!-- Kontak WhatsApp 1 -->
        <div class="mb-3">
            <label>Nama Kontak 1</label>
            <input type="text" id="wa-name-1" placeholder="Contoh: Admin TKQ">
        </div>
        <div class="mb-3">
            <label>Nomor WhatsApp 1</label>
            <input type="text" id="wa-number-1" placeholder="628xxxxxxxxxx">
        </div>

        <!-- Kontak WhatsApp 2 -->
        <div class="mb-3">
            <label>Nama Kontak 2</label>
            <input type="text" id="wa-name-2" placeholder="Contoh: Admin ULA">
        </div>
        <div class="mb-3">
            <label>Nomor WhatsApp 2</label>
            <input type="text" id="wa-number-2" placeholder="628xxxxxxxxxx">
        </div>

        <!-- Kontak WhatsApp 3 -->
        <div class="mb-3">
            <label>Nama Kontak 3</label>
            <input type="text" id="wa-name-3" placeholder="Contoh: Admin WUSTHO">
        </div>
        <div class="mb-3">
            <label>Nomor WhatsApp 3</label>
            <input type="text" id="wa-number-3" placeholder="628xxxxxxxxxx">
        </div>

        <!-- Link Brosur per Tingkatan -->
        <div class="brochure-section">
            <h3>Link URL Brosur per Tingkatan</h3>

            <!-- Brosur TKQ -->
            <div class="mb-3">
                <label>Link Brosur TKQ</label>
                <input type="url" id="input-brosur-tkq" placeholder="https://...">
            </div>

            <!-- Brosur ULA -->
            <div class="mb-3">
                <label>Link Brosur ULA (SD)</label>
                <input type="url" id="input-brosur-ula" placeholder="https://...">
            </div>

            <!-- Brosur WUSTHO -->
            <div class="mb-3">
                <label>Link Brosur WUSTHO (SMP)</label>
                <input type="url" id="input-brosur-wustho" placeholder="https://...">
            </div>

            <!-- Brosur ULYA -->
            <div class="mb-3">
                <label>Link Brosur ULYA (SMA)</label>
                <input type="url" id="input-brosur-ulya" placeholder="https://...">
            </div>
        </div>

        <button type="submit" class="btn-save">SIMPAN PERUBAHAN</button>
    </form>

    <a href="index.html" class="back-link">← Kembali ke halaman publik</a>
</div>

<script type="module" src="admin.js"></script>

</body>
</html>
