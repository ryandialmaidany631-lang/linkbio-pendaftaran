<!-- Upload Brosur per Tingkatan -->
<div class="brochure-section">
    <h3>Upload Brosur per Tingkatan (PDF/Gambar)</h3>

    <!-- Brosur TKQ -->
    <div class="mb-3">
        <label>Brosur TKQ</label>
        <div id="status-brosur-tkq" style="font-size: 12px; color: #059669; font-weight: 600; margin-bottom: 4px; display: none;">
            ✓ Brosur sudah diupload. 
            <button type="button" id="btn-hapus-tkq" style="background: #ef4444; color: white; border: none; padding: 2px 8px; border-radius: 4px; cursor: pointer; margin-left: 8px; font-size: 11px;">Hapus / Ganti</button>
        </div>
        <input type="file" id="input-brosur-tkq" accept=".pdf, image/*">
    </div>

    <!-- Brosur ULA -->
    <div class="mb-3">
