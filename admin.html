<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Dashboard Admin - Pendaftaran</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #334155; padding: 40px 20px; }
        .container { max-width: 800px; margin: auto; background: #ffffff; padding: 35px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        
        .section-title { font-size: 16px; color: #0f172a; margin-top: 35px; margin-bottom: 20px; font-weight: 700; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; }
        
        label { display: block; font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 8px; margin-top: 20px; text-transform: uppercase; }
        input[type="text"], input[type="url"] { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; font-family: inherit; transition: border-color 0.2s; }
        input:focus { border-color: #3b82f6; outline: none; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        /* Desain Kotak Upload Bersih (Link Panjang Disembunyikan) */
        .file-group { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; background: #f8fafc; padding: 12px 16px; border-radius: 8px; border: 1px solid #cbd5e1; }
        .status-indicator { flex: 1; font-size: 13px; font-weight: 700; color: #ef4444; }
        .btn-action { padding: 8px 14px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 12px; transition: 0.2s; }
        .btn-upload { background-color: #3b82f6; color: white; }
        .btn-upload:hover { background-color: #2563eb; }
        .btn-hapus { background-color: #fee2e2; color: #ef4444; }
        .btn-hapus:hover { background-color: #fca5a5; color: white; }
        
        button[type="submit"] { background-color: #2563eb; color: white; border: none; padding: 14px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; font-size: 15px; margin-top: 35px; }
        button[type="submit"]:hover { background-color: #1d4ed8; }
        
        #status-message { display: none; text-align: center; margin-top: 15px; padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 600; }
        .success { background-color: #dcfce7; color: #166534; }
        .error { background-color: #fee2e2; color: #991b1b; }
        
        /* Desain Dropdown Grafik */
        .filter-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        select { padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; font-family: inherit; font-size: 13px; font-weight: 600; color: #0f172a; outline: none; cursor: pointer; }
        
        @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; gap: 0; } .file-group { flex-wrap: wrap; } }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- BAGIAN GRAFIK DAN DROPDOWN -->
        <div class="section-title">📊 Laporan Kunjungan & Download Brosur</div>
        <div class="filter-container">
            <span style="font-size: 13px; color: #64748b;">Pilih Tanggal:</span>
            <select id="filterTanggal">
                <option value="total">Data Keseluruhan (Total)</option>
            </select>
        </div>
        <div style="position: relative; height: 260px; width: 100%; margin-bottom: 20px;">
            <canvas id="statistikChart"></canvas>
        </div>

        <form id="admin-form">
            <div class="section-title">📝 Pengaturan Konten Web</div>
            
            <label>Judul Website</label>
            <input type="text" id="judul">
            
            <label>Tagline / Sub-judul</label>
            <input type="text" id="tagline">
            
            <label>Link Website Pendaftaran Online</label>
            <input type="url" id="pendaftaranLink">

            <!-- LOGO: Link URL Disembunyikan (Hidden) -->
            <label>Logo Sekolah</label>
            <div class="file-group">
                <input type="hidden" id="logoUrl">
                <input type="file" id="file_logo" style="display:none" accept="image/*" onchange="document.getElementById('status_logo').innerText='⏳ File Siap Disimpan'; document.getElementById('status_logo').style.color='#d97706';">
                <div id="status_logo" class="status-indicator">❌ Belum Ada File</div>
                <button type="button" class="btn-action btn-upload" onclick="document.getElementById('file_logo').click()">📁 Upload Ganti</button>
                <button type="button" class="btn-action btn-hapus" onclick="document.getElementById('logoUrl').value=''; document.getElementById('file_logo').value=''; document.getElementById('status_logo').innerText='❌ Belum Ada File'; document.getElementById('status_logo').style.color='#ef4444';">🗑️ Hapus</button>
            </div>

            <div class="section-title">💬 Kontak Admin WhatsApp</div>
            <div class="grid-2">
                <div><label>Nama Admin 1</label><input type="text" id="waName1"></div>
                <div><label>Nomor WA 1 (Mulai 08...)</label><input type="text" id="waNumber1"></div>
                <div><label>Nama Admin 2</label><input type="text" id="waName2"></div>
                <div><label>Nomor WA 2</label><input type="text" id="waNumber2"></div>
                <div><label>Nama Admin 3</label><input type="text" id="waName3"></div>
                <div><label>Nomor WA 3</label><input type="text" id="waNumber3"></div>
            </div>

            <div class="section-title">📄 Manajemen File Brosur</div>
            
            <!-- BROSUR TKQ -->
            <label>Brosur TKQ</label>
            <div class="file-group">
                <input type="hidden" id="brochure_tkq">
                <input type="file" id="file_tkq" style="display:none" accept="image/*,.pdf" onchange="document.getElementById('status_tkq').innerText='⏳ File Siap Disimpan'; document.getElementById('status_tkq').style.color='#d97706';">
                <div id="status_tkq" class="status-indicator">❌ Belum Ada File</div>
                <button type="button" class="btn-action btn-upload" onclick="document.getElementById('file_tkq').click()">📁 Upload Ganti</button>
                <button type="button" class="btn-action btn-hapus" onclick="document.getElementById('brochure_tkq').value=''; document.getElementById('file_tkq').value=''; document.getElementById('status_tkq').innerText='❌ Belum Ada File'; document.getElementById('status_tkq').style.color='#ef4444';">🗑️ Hapus</button>
            </div>
            
            <!-- BROSUR ULA -->
            <label>Brosur ULA (SD)</label>
            <div class="file-group">
                <input type="hidden" id="brochure_ula">
                <input type="file" id="file_ula" style="display:none" accept="image/*,.pdf" onchange="document.getElementById('status_ula').innerText='⏳ File Siap Disimpan'; document.getElementById('status_ula').style.color='#d97706';">
                <div id="status_ula" class="status-indicator">❌ Belum Ada File</div>
                <button type="button" class="btn-action btn-upload" onclick="document.getElementById('file_ula').click()">📁 Upload Ganti</button>
                <button type="button" class="btn-action btn-hapus" onclick="document.getElementById('brochure_ula').value=''; document.getElementById('file_ula').value=''; document.getElementById('status_ula').innerText='❌ Belum Ada File'; document.getElementById('status_ula').style.color='#ef4444';">🗑️ Hapus</button>
            </div>
            
            <!-- BROSUR WUSTHO -->
            <label>Brosur WUSTHO (SMP)</label>
            <div class="file-group">
                <input type="hidden" id="brochure_wustho">
                <input type="file" id="file_wustho" style="display:none" accept="image/*,.pdf" onchange="document.getElementById('status_wustho').innerText='⏳ File Siap Disimpan'; document.getElementById('status_wustho').style.color='#d97706';">
                <div id="status_wustho" class="status-indicator">❌ Belum Ada File</div>
                <button type="button" class="btn-action btn-upload" onclick="document.getElementById('file_wustho').click()">📁 Upload Ganti</button>
                <button type="button" class="btn-action btn-hapus" onclick="document.getElementById('brochure_wustho').value=''; document.getElementById('file_wustho').value=''; document.getElementById('status_wustho').innerText='❌ Belum Ada File'; document.getElementById('status_wustho').style.color='#ef4444';">🗑️ Hapus</button>
            </div>
            
            <!-- BROSUR ULYA -->
            <label>Brosur ULYA (SMA)</label>
            <div class="file-group">
                <input type="hidden" id="brochure_ulya">
                <input type="file" id="file_ulya" style="display:none" accept="image/*,.pdf" onchange="document.getElementById('status_ulya').innerText='⏳ File Siap Disimpan'; document.getElementById('status_ulya').style.color='#d97706';">
                <div id="status_ulya" class="status-indicator">❌ Belum Ada File</div>
                <button type="button" class="btn-action btn-upload" onclick="document.getElementById('file_ulya').click()">📁 Upload Ganti</button>
                <button type="button" class="btn-action btn-hapus" onclick="document.getElementById('brochure_ulya').value=''; document.getElementById('file_ulya').value=''; document.getElementById('status_ulya').innerText='❌ Belum Ada File'; document.getElementById('status_ulya').style.color='#ef4444';">🗑️ Hapus</button>
            </div>

            <button type="submit" id="btn-simpan">💾 Simpan Perubahan</button>
            <div id="status-message"></div>
        </form>
    </div>

    <!-- UPDATE VERSI SCRIPT 909 -->
    <script type="module" src="admin.js?v=909"></script>
</body>
</html>
