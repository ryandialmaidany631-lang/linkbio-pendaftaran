<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran & Informasi Sekolah</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Logo Sekolah -->
        <div class="logo-container">
            <img id="display-logo" src="" alt="Logo Sekolah" style="width: 90px; height: 90px; border-radius: 50%; object-fit: cover; display: none; margin: 0 auto 15px auto;">
        </div>

        <!-- Judul & Tagline -->
        <h1 id="display-judul">Nama Sekolah</h1>
        <p id="display-tagline" class="tagline">Informasi Pendaftaran dan Brosur Resmi</p>

        <!-- Link Website Pendaftaran Utama -->
        <div class="link-section">
            <a id="link-pendaftaran" href="#" target="_blank" class="btn btn-primary">Website Pendaftaran Online</a>
        </div>

        <!-- 3 Tombol WhatsApp -->
        <div class="whatsapp-section" id="whatsapp-container">
            <!-- Dimuat otomatis oleh app.js -->
        </div>

        <!-- 4 Tombol Brosur Tingkatan -->
        <div class="brochure-section">
            <h3>Download Brosur Pendaftaran</h3>
            <div id="brochure-container">
                <!-- Dimuat otomatis oleh app.js -->
            </div>
        </div>

        <!-- Tombol Menuju Admin -->
        <div class="admin-link-container" style="margin-top: 30px;">
            <a href="admin.html" style="font-size: 12px; color: #666; text-decoration: none;">⚙️ Masuk Panel Admin</a>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
