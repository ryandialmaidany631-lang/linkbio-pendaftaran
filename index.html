<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Pendaftaran & Informasi Sekolah</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #3b82f6 100%);
            color: #1e293b; min-height: 100vh; display: flex;
            align-items: center; justify-content: center; padding: 20px;
        }
        .container {
            width: 100%; max-width: 480px; background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px); margin: auto; padding: 40px 25px;
            border-radius: 28px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            text-align: center; animation: fadeInUp 0.6s ease-out forwards;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        #logo-container { margin-bottom: 22px; display: none; }
        #display-logo {
            width: 120px; height: 120px; object-fit: contain; border-radius: 50%;
            padding: 6px; background: #ffffff; box-shadow: 0 10px 25px rgba(30, 58, 138, 0.15);
            border: 3px solid #e0f2fe; transition: transform 0.3s ease;
        }
        #display-logo:hover { transform: scale(1.05); }

        #display-judul {
            font-size: 20px; font-weight: 800; margin-bottom: 8px; color: #0f172a; line-height: 1.4;
        }
        #display-tagline {
            font-size: 13px; color: #64748b; margin-bottom: 30px; font-weight: 600; text-transform: uppercase;
        }

        .section-label {
            font-weight: 700; font-size: 11px; color: #64748b; margin-bottom: 12px;
            text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .section-label::before, .section-label::after {
            content: ""; height: 1px; flex: 1; background: #e2e8f0; max-width: 40px;
        }

        a { transition: all 0.25s ease !important; }
        a:active { transform: scale(0.96) !important; }

        .link-section { margin-bottom: 25px; }
        #link-pendaftaran {
            display: none; background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            color: white; padding: 15px 20px; border-radius: 14px; text-decoration: none;
            font-weight: 700; width: 100%; font-size: 15px; box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
        }

        #whatsapp-section-wrapper { display: none; margin-bottom: 25px; }
        #whatsapp-container a {
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #16a34a 0%, #22c55e 100%);
            color: white; padding: 14px 18px; border-radius: 14px; text-decoration: none;
            font-weight: 700; margin-bottom: 12px; font-size: 14px;
        }

        #brochure-section-wrapper { display: none; }
        #brochure-container a {
            display: block; background-color: #f8fafc; color: #334155; border: 1px solid #cbd5e1;
            padding: 14px 18px; border-radius: 14px; text-decoration: none; font-weight: 700;
            margin-bottom: 10px; font-size: 14px;
        }

        /* ======= CSS POPUP BROSUR (FULLSCREEN LAYAR HITAM) ======= */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); z-index: 1000; flex-direction: column; 
            align-items: center; opacity: 0; animation: fadeInModal 0.3s forwards;
        }
        @keyframes fadeInModal { to { opacity: 1; } }
        
        .modal-top-bar {
            width: 100%; padding: 15px 25px; display: flex; 
            justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.6);
        }
        .close-btn {
            background: none; color: #fff; border: none; font-size: 32px; 
            font-weight: bold; cursor: pointer; padding: 0 10px;
        }
        .download-btn {
            background: #f59e0b; color: white !important; padding: 10px 20px; cursor: pointer;
            border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 15px; border: none;
        }
        
        #brochure-image {
            max-width: 95%; max-height: calc(100vh - 80px); 
            object-fit: contain; margin-top: 15px; border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="logo-container"><img id="display-logo" src="" alt="Logo"></div>
        <h1 id="display-judul">Memuat...</h1>
        <p id="display-tagline">Link Pendaftaran & Info Pendaftaran</p>

        <div class="link-section"><a id="link-pendaftaran" href="#" target="_blank">✨ Website Pendaftaran Online</a></div>

        <div id="whatsapp-section-wrapper">
            <div class="section-label">Kontak Informasi & Pendaftaran</div>
            <div id="whatsapp-container"></div>
        </div>

        <div id="brochure-section-wrapper">
            <div class="section-label">Lihat & Download Brosur</div>
            <div id="brochure-container"></div>
        </div>
    </div>

    <!-- Kotak Popup (Layar Penuh Hitam) -->
    <div id="brochure-modal" class="modal-overlay">
        <div class="modal-top-bar">
            <!-- Tombol Download diubah jadi button biasa agar dikontrol JS -->
            <button id="download-brochure-btn" class="download-btn">⬇️ Download Brosur</button>
            <button id="close-modal" class="close-btn">&times;</button>
        </div>
        <img id="brochure-image" src="" alt="Brosur Sekolah">
    </div>

    <script type="module" src="app.js?v=309"></script>
</body>
</html>
