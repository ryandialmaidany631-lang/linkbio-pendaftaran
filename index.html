<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Pendaftaran & Informasi Sekolah</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #3b82f6 100%);
            color: #1e293b; min-height: 100vh; display: flex;
            align-items: center; justify-content: center; padding: 20px;
        }
        
        /* Kotak Utama dengan Efek Glassmorphism Modern */
        .container {
            width: 100%; max-width: 480px; background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(16px); margin: auto; padding: 40px 25px;
            border-radius: 28px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
            text-align: center; animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        #logo-container { margin-bottom: 22px; display: none; }
        #display-logo {
            width: 120px; height: 120px; object-fit: contain; border-radius: 50%;
            padding: 6px; background: #ffffff; 
            box-shadow: 0 10px 25px rgba(30, 58, 138, 0.15), 0 0 0 3px #e0f2fe; 
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #display-logo:hover { transform: scale(1.08) rotate(2deg); }

        #display-judul {
            font-size: 21px; font-weight: 800; margin-bottom: 8px; color: #0f172a; line-height: 1.4;
        }
        #display-tagline {
            font-size: 13px; color: #64748b; margin-bottom: 30px; font-weight: 600; text-transform: uppercase;
        }

        .section-label {
            font-weight: 700; font-size: 11px; color: #64748b; margin-bottom: 12px;
            text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .section-label::before, .section-label::after {
            content: ""; height: 2px; flex: 1; background: #e2e8f0; max-width: 40px; border-radius: 2px;
        }

        /* ======= ANIMASI KLIK (TACTILE SPRING) ======= */
        /* Transisi halus untuk semua tombol */
        a, button { 
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), 
                        box-shadow 0.2s ease, filter 0.2s ease !important; 
            position: relative;
        }
        
        /* Efek mengecil dan memantul ke dalam saat diklik (seperti tombol HP asli) */
        a:active, button:active { 
            transform: scale(0.93) translateY(2px) !important; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.15) !important;
            filter: brightness(0.95);
        }

        /* Styling Tombol Utama */
        .link-section { margin-bottom: 25px; }
        #link-pendaftaran {
            display: none; background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            color: white; padding: 16px 20px; border-radius: 16px; text-decoration: none;
            font-weight: 700; width: 100%; font-size: 15px; 
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }
        #link-pendaftaran:hover { transform: translateY(-3px); box-shadow: 0 15px 30px -5px rgba(37, 99, 235, 0.5); filter: brightness(1.1); }

        #whatsapp-section-wrapper { display: none; margin-bottom: 25px; }
        #whatsapp-container a {
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #16a34a 0%, #22c55e 100%);
            color: white; padding: 15px 18px; border-radius: 14px; text-decoration: none;
            font-weight: 700; margin-bottom: 12px; font-size: 14px;
            box-shadow: 0 8px 20px -5px rgba(22, 163, 74, 0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }
        #whatsapp-container a:hover { transform: translateY(-3px); box-shadow: 0 12px 25px -5px rgba(22, 163, 74, 0.5); filter: brightness(1.1); }

        #brochure-section-wrapper { display: none; }
        #brochure-container a {
            display: block; background-color: #ffffff; color: #334155; 
            border: 2px solid #e2e8f0; padding: 15px 18px; border-radius: 14px; 
            text-decoration: none; font-weight: 700; margin-bottom: 12px; font-size: 14px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        #brochure-container a:hover {
            border-color: #94a3b8; background-color: #f8fafc; color: #0f172a; 
            transform: translateY(-2px); box-shadow: 0 8px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* ======= CSS POPUP BROSUR ======= */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); z-index: 1000; flex-direction: column; 
            align-items: center; opacity: 0; animation: fadeInModal 0.3s forwards;
            backdrop-filter: blur(5px);
        }
        @keyframes fadeInModal { to { opacity: 1; } }
        
        .modal-top-bar {
            width: 100%; padding: 15px 25px; display: flex; 
            justify-content: space-between; align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }
        .close-btn {
            background: rgba(255,255,255,0.1); color: #fff; border: none; 
            font-size: 24px; width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; cursor: pointer; transition: background 0.2s;
        }
        .close-btn:hover { background: rgba(239, 68, 68, 0.8); }

        .download-btn {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); 
            color: white !important; padding: 12px 24px; cursor: pointer;
            border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 15px; 
            border: none; box-shadow: 0 8px 20px -5px rgba(245, 158, 11, 0.5);
        }
        .download-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        
        #brochure-image {
            max-width: 95%; max-height: calc(100vh - 90px); 
            object-fit: contain; margin-top: 5px; border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="logo-container"><img id="display-logo" src="" alt="Logo"></div>
        <h1 id="display-judul">Memuat...</h1>
        <p id="display-tagline">Link Pendaftaran & Info Pendaftaran</p>

        <div class="link-section"><a id="link-pendaftaran" href="#" target="_blank">✨ Website Pendaftaran Online</a></div>

        <div id="whatsapp-section-wrapper">
            <div class="section-label">Kontak Informasi & Pendaftaran</div>
            <div id="whatsapp-container"></div>
        </div>

        <div id="brochure-section-wrapper">
            <div class="section-label">Lihat & Download Brosur</div>
            <div id="brochure-container"></div>
        </div>
    </div>

    <div id="brochure-modal" class="modal-overlay">
        <div class="modal-top-bar">
            <button id="download-brochure-btn" class="download-btn">⬇️ Download Brosur</button>
            <button id="close-modal" class="close-btn">&times;</button>
        </div>
        <img id="brochure-image" src="" alt="Brosur Sekolah">
    </div>

    <!-- Versi script dinaikkan untuk memastikan browser memuat UI terbaru -->
    <script type="module" src="app.js?v=310"></script>
</body>
</html>
